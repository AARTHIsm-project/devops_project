<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Student Management System</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e3a8a 0%, #3b0764 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 36px;
  }
  .logo {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: linear-gradient(135deg, #1e3a8a, #3b0764);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 24px;
    font-weight: 700;
    margin: 0 auto 16px;
  }
  h1 { margin: 0 0 4px; font-size: 22px; text-align: center; }
  .subtitle { color: #6b7280; margin: 0 0 28px; font-size: 13px; text-align: center; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #374151; }
  input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: #3b0764; }
  button {
    width: 100%;
    background: #1e3a8a;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #172d6b; }
  button:disabled { background: #93a4d6; cursor: not-allowed; }
  #errorMsg { color: #dc2626; font-size: 13px; margin-bottom: 12px; display: none; text-align: center; }
  .hint { margin-top: 18px; font-size: 12px; color: #9ca3af; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">SM</div>
    <h1>Student Management System</h1>
    <p class="subtitle">Sign in to manage student records</p>

    <div id="errorMsg"></div>

    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />

      <button type="submit" id="loginBtn">Sign in</button>
    </form>

    <p class="hint">Demo credentials — username: <b>admin</b>, password: <b>admin123</b><br/>
    (In-memory only — data resets when the server restarts.)</p>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');
  const loginBtn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in...';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!res.ok) {
        errorMsg.textContent = data.error || 'Login failed';
        errorMsg.style.display = 'block';
        return;
      }
      window.location.href = '/dashboard';
    } catch (err) {
      errorMsg.textContent = 'Could not reach the server. Please try again.';
      errorMsg.style.display = 'block';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
