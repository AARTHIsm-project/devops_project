<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — DevOps Demo App</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 40px 20px;
    color: #1a1a1a;
  }
  .container {
    max-width: 680px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    padding: 32px;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .subtitle { color: #6b7280; margin: 0 0 20px; font-size: 13px; }
  .badge {
    display: inline-block;
    background: #d1fae5;
    color: #065f46;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .user-box { text-align: right; font-size: 13px; }
  .user-box .username { font-weight: 600; display: block; margin-bottom: 6px; }
  .logout-btn {
    background: #f3f4f6;
    color: #374151;
    border: 1px solid #d1d5db;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .logout-btn:hover { background: #e5e7eb; }

  .task-form { display: flex; gap: 8px; margin-bottom: 20px; }
  .task-form input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
  }
  .task-form input:focus { outline: none; border-color: #667eea; }

  button.primary {
    background: #667eea;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:hover { background: #5568d3; }
  button.primary:disabled { background: #a5b4fc; cursor: not-allowed; }

  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
  li .title { flex: 1; font-size: 14px; }
  li .title.done-text { text-decoration: line-through; color: #9ca3af; }
  li .title-input {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid #667eea;
    border-radius: 6px;
    font-size: 14px;
  }
  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
    padding: 4px 8px;
    border-radius: 6px;
    color: #6b7280;
  }
  .icon-btn:hover { background: #f3f4f6; }
  .icon-btn.delete:hover { background: #fee2e2; color: #dc2626; }
  .icon-btn.save { color: #059669; }

  .empty { color: #9ca3af; text-align: center; padding: 20px 0; font-size: 14px; }
  .footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #e5e7eb;
    font-size: 12px;
    color: #9ca3af;
  }
  #errorMsg { color: #dc2626; font-size: 13px; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
  <div class="container">
    <div class="header-row">
      <div>
        <span class="badge" id="statusBadge">● checking status...</span>
        <h1>Task Dashboard</h1>
        <p class="subtitle">In-memory CRUD demo — Jenkins + Docker + GitHub CI/CD <span id="versionTag"></span></p>
      </div>
      <div class="user-box">
        <span class="username" id="usernameLabel"></span>
        <button class="logout-btn" id="logoutBtn">Log out</button>
      </div>
    </div>

    <div id="errorMsg"></div>

    <form class="task-form" id="taskForm">
      <input type="text" id="taskInput" placeholder="Add a new task..." required />
      <button type="submit" class="primary" id="addBtn">Add</button>
    </form>

    <ul id="taskList"></ul>
    <div class="empty" id="emptyState" style="display:none;">No tasks yet — add one above.</div>

    <div class="footer">In-memory storage only — data resets whenever the server restarts.</div>
  </div>

<script>
  const taskList = document.getElementById('taskList');
  const emptyState = document.getElementById('emptyState');
  const taskForm = document.getElementById('taskForm');
  const taskInput = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const errorMsg = document.getElementById('errorMsg');
  const statusBadge = document.getElementById('statusBadge');
  const versionTag = document.getElementById('versionTag');
  const usernameLabel = document.getElementById('usernameLabel');
  const logoutBtn = document.getElementById('logoutBtn');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }
  function clearError() {
    errorMsg.style.display = 'none';
  }
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function checkAuth() {
    const res = await fetch('/api/me');
    const data = await res.json();
    if (!data.authenticated) {
      window.location.href = '/login';
      return;
    }
    usernameLabel.textContent = data.username;
  }

  function renderTasks(tasks) {
    taskList.innerHTML = '';
    if (!tasks.length) {
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    tasks.forEach((task) => {
      const li = document.createElement('li');
      li.dataset.id = task.id;

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.done;
      checkbox.addEventListener('change', () => toggleDone(task.id, checkbox.checked));

      const titleSpan = document.createElement('span');
      titleSpan.className = 'title' + (task.done ? ' done-text' : '');
      titleSpan.textContent = task.title;

      const editBtn = document.createElement('button');
      editBtn.className = 'icon-btn';
      editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', () => startEdit(li, task));

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'icon-btn delete';
      deleteBtn.textContent = 'Delete';
      deleteBtn.addEventListener('click', () => deleteTask(task.id));

      li.appendChild(checkbox);
      li.appendChild(titleSpan);
      li.appendChild(editBtn);
      li.appendChild(deleteBtn);
      taskList.appendChild(li);
    });
  }

  function startEdit(li, task) {
    li.innerHTML = '';

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'title-input';
    input.value = task.title;

    const saveBtn = document.createElement('button');
    saveBtn.className = 'icon-btn save';
    saveBtn.textContent = 'Save';
    saveBtn.addEventListener('click', () => saveEdit(task.id, input.value));

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'icon-btn';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', loadTasks);

    li.appendChild(input);
    li.appendChild(saveBtn);
    li.appendChild(cancelBtn);
    input.focus();
  }

  async function loadTasks() {
    try {
      const res = await fetch('/api/tasks');
      if (res.status === 401) { window.location.href = '/login'; return; }
      if (!res.ok) throw new Error('Failed to load tasks');
      const tasks = await res.json();
      renderTasks(tasks);
      clearError();
    } catch (err) {
      showError('Could not load tasks. Is the API reachable?');
    }
  }

  async function checkHealth() {
    try {
      const res = await fetch('/health');
      statusBadge.textContent = res.ok ? '● service healthy' : '● service unhealthy';
    } catch {
      statusBadge.textContent = '● service unreachable';
    }
  }

  async function loadInfo() {
    try {
      const res = await fetch('/api/info');
      const data = await res.json();
      if (data.version) versionTag.textContent = `(build ${data.version})`;
    } catch {
      // non-critical
    }
  }

  taskForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = taskInput.value.trim();
    if (!title) return;

    addBtn.disabled = true;
    addBtn.textContent = 'Adding...';
    try {
      const res = await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });
      if (!res.ok) throw new Error('Failed to add task');
      taskInput.value = '';
      clearError();
      await loadTasks();
    } catch (err) {
      showError('Could not add task. Please try again.');
    } finally {
      addBtn.disabled = false;
      addBtn.textContent = 'Add';
    }
  });

  async function toggleDone(id, done) {
    try {
      const res = await fetch(`/api/tasks/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done })
      });
      if (!res.ok) throw new Error('Failed to update task');
      clearError();
      await loadTasks();
    } catch (err) {
      showError('Could not update task.');
    }
  }

  async function saveEdit(id, title) {
    if (!title.trim()) return;
    try {
      const res = await fetch(`/api/tasks/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: title.trim() })
      });
      if (!res.ok) throw new Error('Failed to update task');
      clearError();
      await loadTasks();
    } catch (err) {
      showError('Could not save changes.');
    }
  }

  async function deleteTask(id) {
    try {
      const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error('Failed to delete task');
      clearError();
      await loadTasks();
    } catch (err) {
      showError('Could not delete task.');
    }
  }

  logoutBtn.addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login';
  });

  checkAuth();
  loadTasks();
  checkHealth();
  loadInfo();
</script>
</body>
</html>
